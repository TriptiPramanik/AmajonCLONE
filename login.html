<!DOCTYPE html>
<html>
<head>
  <title>Amazon Sign In</title>
  <link rel="stylesheet" href="styles2.css">
</head>
<body>
<img class="logo"src="amazon-logo.png" alt="Amazon Logo">
<div class="line">
<h2>Sign In</h2>
<form onsubmit="login(event)">
  <input type="email" id="email" placeholder="Email" required><br><br>
  <input type="password" id="password" placeholder="Password" required><br><br>

  <button class="submit" type="submit">Sign In</button>
</form>

<p>New to Amazon?</p>
<a href="signup.html">Create your Amazon account</a>
</div>  
<script>
  function login(event) {
    event.preventDefault();

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    let storedEmail = localStorage.getItem("registeredEmail");
    let storedPassword = localStorage.getItem("registeredPassword");

    if (email === storedEmail && password === storedPassword) {
      localStorage.setItem("isLoggedIn", "true");
      localStorage.setItem("userEmail", email);
      window.location.href = "index.html";
    } else {
      alert("Invalid email or password ");
    }
  }
</script>

</body>
</html>
